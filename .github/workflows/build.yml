name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build
        shell: cmd
        run: build.cmd

      - uses: actions/upload-artifact@v6
        with:
          name: DeadlockOutlines
          path: build/DeadlockOutlines.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/DeadlockOutlines.exe --clobber || gh release create "$GITHUB_REF_NAME" build/DeadlockOutlines.exe --title "$GITHUB_REF_NAME" --generate-notes
